# =============================================================================
# dockprom-remote-server
# Run this on your GPU machine to send metrics to the central dashboard.
#
# SETUP:
#   1. cp .env.example .env  — then fill in MAIN_SERVER_IP and SERVER_ID
#   2. Update the libnvidia-ml.so path below to match your driver version
#        Run: ls /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.*
#   3. docker compose up -d
# =============================================================================

services:

  nodeexporter:
    image: prom/node-exporter:v1.9.1
    container_name: nodeexporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    network_mode: host
    labels:
      org.label-schema.group: "monitoring"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    restart: unless-stopped
    network_mode: host
    labels:
      org.label-schema.group: "monitoring"

  otel-gpu-collector:
    image: ghcr.io/openlit/otel-gpu-collector:latest
    container_name: otel-gpu-collector
    environment:
      OTEL_SERVICE_NAME: ${SERVER_ID:-remote-gpu}
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production,server_id=${SERVER_ID:-remote-gpu}"
      # Points to the central monitoring server — set MAIN_SERVER_IP in .env
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://${MAIN_SERVER_IP}:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    volumes:
      - /dev/dri:/dev/dri
      # ↓ UPDATE THIS — replace with your libnvidia-ml.so filename
      # Run: ls /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.*
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.REPLACE_VERSION:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      org.label-schema.group: "monitoring"
